name: Claude Code Review

on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.issue.number }}-${{ startsWith(github.event.comment.body, '/claude-review') && 'run' || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      conclusion: ${{ steps.claude.outcome }}
      verdict: ${{ steps.claude.outputs.structured_output }}
    steps:
      - name: Resolve PR
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.comment.user.login,
            });
            if (!['admin', 'write'].includes(permission)) {
              core.setFailed('Only users with write access can request a Claude review.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            if (pr.state !== 'open' || pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Claude review runs only on open, same-repository PRs.');
              return;
            }
            await github.rest.reactions.createForIssueComment({
              ...context.repo, comment_id: context.payload.comment.id, content: 'eyes',
            });
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: 'claude-review',
              state: 'pending',
              description: 'Claude review running.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.setOutput('sha', pr.head.sha);

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(gh *)" "Bash(git *)" "Read" "Write" "Glob" "Grep" "LS" "Skill"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["blocking","summary"],"additionalProperties":false}'
          prompt: |
            Use the Skill tool to invoke the `code-review` skill for PR #${{ github.event.issue.number }} at commit ${{ steps.pr.outputs.sha }}.

            When running `gh pr view` and `gh pr diff`, add `--repo ${{ github.repository }}`.
            Substitute `{owner}/{repo}` with `${{ github.repository }}` in all commands.
            Post reviews with event COMMENT only; never approve or request changes.

            Return `blocking` as the number of BLOCKING issues found and `summary` as one sentence.

  result:
    needs: review
    if: ${{ !cancelled() && needs.review.outputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/pr-review
      - uses: actions/github-script@v8
        env:
          SHA: ${{ needs.review.outputs.sha }}
          CONCLUSION: ${{ needs.review.outputs.conclusion }}
          VERDICT: ${{ needs.review.outputs.verdict }}
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { pathToFileURL } = await import('node:url');
            const path = `${process.env.GITHUB_WORKSPACE}/.github/pr-review`;
            const { claudeVerdict, STATUS_CONTEXT } = await import(pathToFileURL(`${path}/policy.js`).href);
            const { default: run } = await import(pathToFileURL(`${path}/run.js`).href);
            const { state, description } = claudeVerdict(process.env.CONCLUSION, process.env.VERDICT);
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.SHA,
              context: STATUS_CONTEXT,
              state,
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            const config = JSON.parse(await readFile(`${path}/policy-config.json`, 'utf8'));
            await run({
              github, context, core, config, pullNumber: context.issue.number,
            });
