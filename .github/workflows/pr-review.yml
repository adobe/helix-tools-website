name: PR review eligibility

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/pr-review
      - uses: actions/github-script@v8
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { pathToFileURL } = await import('node:url');
            const path = `${process.env.GITHUB_WORKSPACE}/.github/pr-review`;
            const { default: run } = await import(pathToFileURL(`${path}/run.js`).href);
            const trustedContributors = JSON.parse(await readFile(`${path}/trusted-contributors.json`, 'utf8'));
            await run({ github, context, core, trustedContributors });
